name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.9', '1.27.x']
    env:
      DURABLE_TEST_ARTIFACT_DIR: artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Verify the complete development loop
        run: go run ./cmd/dev check
      - name: Repeat process recovery
        run: go run ./cmd/dev e2e -count=2 -run=TestProcessCrashRecovery ./tests/e2e
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-${{ matrix.go }}
          path: artifacts/

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DURABLE_TEST_ARTIFACT_DIR: artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go run ./cmd/dev race
      - name: Repeat concurrent claims and recovery
        run: go run ./cmd/dev race -count=3 -run='TestConcurrentClaims|TestWorkerCrash|TestWorkerLeaseLoss|TestSchedulerRun' ./tests/integration
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: race
          path: artifacts/

  windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go run ./cmd/dev fmt-check
      - run: go run ./cmd/dev lint
      - run: go run ./cmd/dev test

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go run ./cmd/dev vuln
