name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: durable
          POSTGRES_PASSWORD: durable
          POSTGRES_USER: durable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U durable -d durable"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 20
    env:
      DURABLE_TEST_DATABASE_URL: postgres://durable:durable@localhost:5432/durable?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Run static analysis
        run: |
          go vet ./...
          go vet -tags=integration ./...
      - name: Run unit tests
        run: go test ./...
      - name: Run integration tests
        run: go test -tags=integration ./...
