services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: durable
      POSTGRES_PASSWORD: durable
      POSTGRES_USER: durable
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U durable -d durable"]
      interval: 1s
      timeout: 5s
      retries: 20
    volumes:
      - durable-postgres:/var/lib/postgresql/data

volumes:
  durable-postgres:
